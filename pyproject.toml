
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ecopulse"
version = "0.1.0"
description = "Environmental Intelligence and Monitoring Platform"
requires-python = ">=3.12,<3.14"

dependencies = [
    "psycopg[binary]>=3.3.9,<4.0",
    "python-dotenv>=1.2.4,<2.0",
    "httpx2>=2.16.2,<3.0",
    "pydantic>=2.14.4,<3.0",
    "boto3>=1.44,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.9,<1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
